<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喵娘 H 播放器</title>
<style>
body { margin:0; background:#000; color:#fff; font-family:system-ui; }
#video { width:100%; height:100vh; background:#000; }
.info { position:fixed; top:8px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,.7); color:#0f0; padding:4px 12px; border-radius:6px;
  font:12px monospace; z-index:10; }
.err { color:#f44; }
</style>
</head>
<body>
<div class="info" id="info">加载中...</div>
<video id="video" controls autoplay playsinline></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const info = document.getElementById('info');
const video = document.getElementById('video');
const params = new URLSearchParams(location.search);
let url = params.get('url');
if (!url) {
  info.textContent = '缺少 url 参数';
} else if (Hls.isSupported()) {
  const hls = new Hls();
  hls.loadSource(url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    info.textContent = '已就绪 ✓ ' + hls.levels.length + ' 档画质';
    video.play().catch(()=>{});
  });
  hls.on(Hls.Events.ERROR, (e, data) => {
    if (data.fatal) {
      info.className = 'info err';
      info.textContent = '播放错误: ' + data.type + '/' + data.details;
    }
  });
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = url;
  info.textContent = '原生 HLS 播放';
} else {
  info.textContent = '此浏览器不支持 HLS';
}
</script>
</body>
</html>
